name: ${COMPOSE_PROJECT_NAME:?Set COMPOSE_PROJECT_NAME}
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"
x-backend: &backend
  image: ${COMPOSE_PROJECT_NAME}-backend:${RELEASE_TAG:-local}
  build:
    context: ./backend
    target: production
  restart: unless-stopped
  environment: &backend-env
    APP_ENV: prod
    APP_DEBUG: "0"
    APP_RUNTIME_OPTIONS: '{"disable_dotenv":true}'
    APP_SECRET: ${APP_SECRET:?Set APP_SECRET}
    DATABASE_URL: postgresql://pubsetup_app:${APP_DB_PASSWORD:?Set APP_DB_PASSWORD}@postgres:5432/${POSTGRES_DB:-pubsetup}
    POSTMARK_SERVER_TOKEN: ${POSTMARK_SERVER_TOKEN:-}
    POSTMARK_MESSAGE_STREAM: ${POSTMARK_MESSAGE_STREAM:-outbound}
    MAIL_FROM: ${MAIL_FROM:-contact@pubsetup.com}
    MAIL_NOTIFICATION_TO: ${MAIL_NOTIFICATION_TO:-contact@pubsetup.com}
    MAIL_TRANSPORT: ${MAIL_TRANSPORT:-smtp}
    SMTP_HOST: ${SMTP_HOST:-smtppro.zoho.eu}
    SMTP_PORT: ${SMTP_PORT:-587}
    SMTP_ENCRYPTION: ${SMTP_ENCRYPTION:-tls}
    SMTP_USERNAME: ${SMTP_USERNAME:-}
    SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  depends_on:
    postgres:
      condition: service_healthy
  logging: *logging
  volumes:
    - module_uploads:/app/var/storage
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pubsetup}
      POSTGRES_USER: ${POSTGRES_USER:-pubsetup}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./ops/postgres/init-app.sh:/docker-entrypoint-initdb.d/10-app.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
    logging: *logging
  backend:
    <<: *backend
    healthcheck:
      test: ["CMD-SHELL", "SCRIPT_FILENAME=/app/public/index.php REQUEST_METHOD=GET REQUEST_URI=/health SCRIPT_NAME=/index.php cgi-fcgi -bind -connect 127.0.0.1:9000 | grep -q '\"status\":\"ok\"'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
  worker:
    <<: *backend
    command: ["php", "bin/console", "app:email-worker"]
  migrate:
    <<: *backend
    profiles: ["tools"]
    restart: "no"
    command: ["php", "bin/console", "app:migrate"]
    environment:
      <<: *backend-env
      DATABASE_URL: postgresql://${POSTGRES_USER:-pubsetup}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-pubsetup}
  frontend:
    image: ${COMPOSE_PROJECT_NAME}-frontend:${RELEASE_TAG:-local}
    build:
      context: ./frontend
      target: production
    restart: unless-stopped
    init: true
    volumes:
      - frontend_image_cache:/app/.next/cache/images
    environment:
      SITE_URL: ${SITE_URL:?Set SITE_URL}
      API_INTERNAL_URL: http://gateway:8082
      DEMO_ADMIN_ENABLED: ${DEMO_ADMIN_ENABLED:-1}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
    logging: *logging
  gateway:
    image: nginx:stable-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${HTTP_PORT:-8080}:8082"
    volumes:
      - ./ops/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - module_uploads:/srv/uploads:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8082/health"]
      interval: 10s
      timeout: 5s
      retries: 6
    logging: *logging
volumes:
  frontend_image_cache:
  module_uploads:
  postgres_data:
