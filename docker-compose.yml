name: pubsetup-dev
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pubsetup
      POSTGRES_USER: pubsetup
      POSTGRES_PASSWORD: pubsetup
      APP_DB_PASSWORD: pubsetup
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./ops/postgres/init-app.sh:/docker-entrypoint-initdb.d/10-app.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pubsetup -d pubsetup"]
      interval: 3s
      timeout: 3s
      retries: 20
  backend:
    build:
      context: ./backend
      target: development
    environment:
      APP_ENV: dev
      APP_DEBUG: "1"
      APP_SECRET: local-development-only
      DATABASE_URL: postgresql://pubsetup_app:pubsetup@postgres:5432/pubsetup
    volumes:
      - ./backend/src:/app/src
      - ./backend/config:/app/config
      - ./backend/migrations:/app/migrations
      - ./backend/tests:/app/tests
    depends_on:
      postgres:
        condition: service_healthy
  migrate:
    profiles: ["tools"]
    build:
      context: ./backend
      target: development
    environment:
      APP_ENV: dev
      APP_SECRET: local-development-only
      DATABASE_URL: postgresql://pubsetup:pubsetup@postgres:5432/pubsetup
    volumes:
      - ./backend/migrations:/app/migrations
    command: ["php", "bin/console", "app:migrate"]
    depends_on:
      postgres:
        condition: service_healthy
  worker:
    build:
      context: ./backend
      target: development
    environment:
      APP_ENV: dev
      APP_SECRET: local-development-only
      DATABASE_URL: postgresql://pubsetup_app:pubsetup@postgres:5432/pubsetup
      POSTMARK_SERVER_TOKEN: ${POSTMARK_SERVER_TOKEN:-}
    command: ["php", "bin/console", "app:email-worker"]
    depends_on:
      postgres:
        condition: service_healthy
  frontend:
    build:
      context: ./frontend
      target: development
    environment:
      SITE_URL: http://localhost:8085
      API_INTERNAL_URL: http://gateway:8082
      NEXT_TELEMETRY_DISABLED: "1"
    volumes:
      - ./frontend/src:/app/src
  gateway:
    image: nginx:stable-alpine
    ports:
      - "127.0.0.1:${DEV_HTTP_PORT:-8085}:8082"
    volumes:
      - ./ops/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
volumes:
  postgres_data:
