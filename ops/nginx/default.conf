map $http_upgrade $connection_upgrade {
    default upgrade;
    "" close;
}
map $http_x_forwarded_proto $forwarded_scheme {
    default $scheme;
    https https;
}
map $forwarded_scheme $forwarded_https {
    default off;
    https on;
}
# Caddy on the host is the only production ingress. Its X-Forwarded-For is trusted.
map $http_x_forwarded_for $client_address {
    default $remote_addr;
    ~^(?<first_address>[0-9a-fA-F:.]+)(,|$) $first_address;
}
server {
    listen 8082;
    server_tokens off;
    client_max_body_size 32k;
    resolver 127.0.0.11 valid=10s ipv6=off;
    location ~ /\. { return 404; }
    location ~ ^/(health$|api(?:/|$)|email/unsubscribe$) {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /app/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param HTTP_PROXY "";
        fastcgi_param HTTPS $forwarded_https;
        fastcgi_param REMOTE_ADDR $client_address;
        set $backend backend:9000;
        fastcgi_pass $backend;
    }
    location / {
        set $frontend http://frontend:3000;
        proxy_pass $frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_set_header X-Forwarded-For $client_address;
        proxy_set_header X-Forwarded-Proto $forwarded_scheme;
        proxy_buffering off;
    }
}
