framework:
    secret: '%env(APP_SECRET)%'
    handle_all_throwables: true
    http_method_override: false
    php_errors:
        log: true
    router:
        utf8: true
    csrf_protection: true
    session:
        name: pubsetup_admin
        cookie_httponly: true
        cookie_samesite: lax
        cookie_secure: auto
        gc_maxlifetime: 28800
